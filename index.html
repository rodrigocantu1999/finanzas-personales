async function doMigrate(){if(!confirm('Esto reemplazará todos tus datos. ¿Continuar?'))return;try{
var collections=['transactions','transfers','accounts','categories','debts','goals','budgets'];
for(var i=0;i<collections.length;i++){var snap=await db.collection(collections[i]).get();while(snap.docs.length>0){var batch=db.batch();snap.docs.slice(0,500).forEach(function(doc){batch.delete(doc.ref)});await batch.commit();snap=await db.collection(collections[i]).get()}}
var b1=db.batch();MIGRATE_DATA.accounts.forEach(function(a){b1.set(col.acc.doc(a.id),{name:a.name,type:a.type,icon:a.icon,color:a.color,initialBalance:a.initialBalance})});await b1.commit();
var b2=db.batch();MIGRATE_DATA.categories.forEach(function(c){b2.set(col.cat.doc(c.id),{name:c.name,emoji:c.emoji,color:c.color,type:c.type})});await b2.commit();
var txs=MIGRATE_DATA.transactions;for(var j=0;j<txs.length;j+=450){var bt=db.batch();txs.slice(j,j+450).forEach(function(t){bt.set(col.tx.doc(t.id),{tp:t.tp,a:t.a,ds:t.ds,c:t.c,acc:t.acc,d:t.d})});await bt.commit()}
var trs=MIGRATE_DATA.transfers;for(var k=0;k<trs.length;k+=450){var br=db.batch();trs.slice(k,k+450).forEach(function(tr){br.set(col.tr.doc(tr.id),{from:tr.from,to:tr.to,amount:tr.amount,desc:tr.desc,d:tr.d})});await br.commit()}
var b3=db.batch();MIGRATE_DATA.debts.forEach(function(dd){b3.set(col.debt.doc(dd.id),{name:dd.name,total:dd.total,paid:dd.paid,rate:dd.rate||0,minPayment:dd.minPayment,dueDay:dd.dueDay,icon:dd.icon,color:dd.color})});
MIGRATE_DATA.goals.forEach(function(g){b3.set(col.goal.doc(g.id),{name:g.name,target:g.target,saved:g.saved,icon:g.icon,color:g.color,linkedAcc:g.linkedAcc||''})});await b3.commit();
if(MIGRATE_DATA.budgets&&Object.keys(MIGRATE_DATA.budgets).length>0){var b4=db.batch();Object.keys(MIGRATE_DATA.budgets).forEach(function(bk){b4.set(col.bud.doc(bk),{amount:MIGRATE_DATA.budgets[bk]})});await b4.commit()}
await col.meta.doc('status').set({migrated:true,version:'v8',updatedAt:new Date().toISOString()});alert('¡Datos actualizados! '+txs.length+' movimientos.');location.reload();
}catch(e){alert('Error: '+e.message);console.error(e)}}

window.OA=function(){S.modal='add';S.eid=null;var dc=S.cats.find(function(c){return c.type==='expense'}),da=S.accs.length?S.accs[0].id:'';S.f={type:'expense',amt:'',desc:'',cat:dc?dc.id:'',acc:da,d:td()};S.tf={from:'',to:'',amt:'',desc:'',d:td()};R()};
window.CM=function(){S.modal=null;S.eid=null;R()};
window.SF=function(k,v){S.f[k]=v;if(k==='type'||k==='cat'||k==='acc')R()};window.STF=function(k,v){S.tf[k]=v;if(k==='from'||k==='to')R()};window.SDF=function(k,v){S.df[k]=v;if(k==='icon')R()};window.SGF=function(k,v){S.gf[k]=v;if(k==='icon'||k==='linkedAcc')R()};window.SAF=function(k,v){S.af[k]=v;if(k==='icon'||k==='color'||k==='type')R()};window.SBF2=function(k,v){S.bf[k]=v;if(k==='cat')R()};window.SCF=function(k,v){S.cf[k]=v;if(k==='emoji'||k==='color'||k==='type')R()};
window.ST=async function(){var f=S.f,a=parseFloat(f.amt);if(!a||a<=0)return;var ci=gc(f.cat);var t={id:S.eid||uid(),tp:f.type,a:a,ds:f.desc||ci.name||'Mov',c:f.cat,acc:f.acc,d:f.d};try{if(S.eid)await updateTx(S.eid,t);else await addTx(t)}catch(e){}CM()};
window.SATR=async function(){var f=S.tf,a=parseFloat(f.amt);if(!a||!f.from||!f.to)return;try{await addTransfer({id:'tr_'+uid(),from:f.from,to:f.to,amount:a,desc:f.desc||'Transferencia',d:f.d})}catch(e){}CM()};
window.ET=function(id){var t=S.txs.find(function(x){return x.id===id});if(!t)return;S.eid=id;S.f={type:t.tp,amt:String(t.a),desc:t.ds,cat:t.c,acc:t.acc||'',d:t.d};S.modal='add';R()};
window.DT=async function(id){if(!confirm('¿Borrar?'))return;try{await deleteTx(id)}catch(e){}};window.DTR=async function(id){if(!confirm('¿Borrar?'))return;try{await deleteTransfer(id)}catch(e){}};
window.OAC=function(){S.modal='account';S.eid=null;S.af={name:'',type:'debit',icon:'💳',color:'#1D4ED8',initialBalance:'0'};R()};
window.EAC=function(id){var a=S.accs.find(function(x){return x.id===id});if(!a)return;S.eid=id;S.af={name:a.name,type:a.type,icon:a.icon,color:a.color,initialBalance:String(a.initialBalance)};S.modal='account';R()};
window.SACC=async function(){var af=S.af;if(!af.name)return;var a={id:S.eid||'a_'+uid(),name:af.name,type:af.type,icon:af.icon,color:af.color,initialBalance:parseFloat(af.initialBalance)||0};try{await saveAccount(a)}catch(e){}CM()};
window.DAC=async function(id){if(!confirm('¿Borrar?'))return;try{await deleteAccount(id)}catch(e){}};
window.OBU=function(){var ec=S.cats.filter(function(c){return c.type==='expense'}),ub=ec.find(function(c){return!S.bud[c.id]});S.modal='budget';S.eid=null;S.bf={cat:ub?ub.id:(ec[0]?ec[0].id:''),amount:''};R()};
window.OBU2=function(cat){S.modal='budget';S.eid=null;S.bf={cat:cat,amount:''};R()};
window.EBU=function(cat){S.eid=cat;S.bf={cat:cat,amount:String(S.bud[cat]||'')};S.modal='budget';R()};
window.SBUG=async function(){var a=parseFloat(S.bf.amount);if(!a||!S.bf.cat)return;try{await setBudget(S.bf.cat,a)}catch(e){}CM()};
window.DBU=async function(cat){if(!confirm('¿Borrar?'))return;try{await deleteBudget(cat)}catch(e){}};
window.OD=function(){S.modal='debt';S.eid=null;S.df={name:'',total:'',paid:'0',icon:'💳',color:'#1D4ED8',minPayment:'',dueDay:''};R()};
window.ED=function(id){var dd=S.debts.find(function(x){return x.id===id});if(!dd)return;S.eid=id;S.df={name:dd.name,total:String(dd.total),paid:String(dd.paid),icon:dd.icon,color:dd.color||'#1D4ED8',minPayment:String(dd.minPayment||''),dueDay:String(dd.dueDay||'')};S.modal='debt';R()};
window.SD=async function(){var f=S.df,tot=parseFloat(f.total);if(!f.name||!tot)return;try{await saveDebt({id:S.eid||'d_'+uid(),name:f.name,total:tot,paid:parseFloat(f.paid)||0,rate:0,minPayment:parseFloat(f.minPayment)||0,dueDay:parseInt(f.dueDay)||0,icon:f.icon,color:f.color})}catch(e){}CM()};
window.DD=async function(id){if(!confirm('¿Borrar?'))return;try{await deleteDebt(id)}catch(e){}};
window.PD=async function(id){var n=parseFloat(prompt('¿Cuánto pagas?'));if(!n||n<=0)return;try{await payDebt(id,n)}catch(e){}};
window.OG=function(){S.modal='goal';S.eid=null;S.gf={name:'',target:'',saved:'0',icon:'🎯',color:'#059669',linkedAcc:''};R()};
window.EG=function(id){var g=S.goals.find(function(x){return x.id===id});if(!g)return;S.eid=id;S.gf={name:g.name,target:String(g.target),saved:String(g.saved),icon:g.icon,color:g.color||'#059669',linkedAcc:g.linkedAcc||''};S.modal='goal';R()};
window.SG=async function(){var f=S.gf,tgt=parseFloat(f.target);if(!f.name||!tgt)return;try{await saveGoal({id:S.eid||'g_'+uid(),name:f.name,target:tgt,saved:parseFloat(f.saved)||0,icon:f.icon,color:f.color,linkedAcc:f.linkedAcc})}catch(e){}CM()};
window.DG=async function(id){if(!confirm('¿Borrar?'))return;try{await deleteGoal(id)}catch(e){}};
window.AGM=async function(id){var n=parseFloat(prompt('¿Cuánto agregar?'));if(!n||n<=0)return;try{await addToGoal(id,n)}catch(e){}};
window.WGM=async function(id){var n=parseFloat(prompt('¿Cuánto retirar?'));if(!n||n<=0)return;try{await withdrawGoal(id,n)}catch(e){}};
window.OCT=function(type){S.modal='category';S.eid=null;S.cf={name:'',emoji:'📋',color:'#64748B',type:type||'expense'};R()};
window.ECT=function(id){var c=S.cats.find(function(x){return x.id===id});if(!c)return;S.eid=id;S.cf={name:c.name,emoji:c.emoji,color:c.color,type:c.type};S.modal='category';R()};
window.SCAT=async function(){var f=S.cf;if(!f.name)return;try{await col.cat.doc(S.eid||'c_'+uid()).set({name:f.name,emoji:f.emoji,color:f.color,type:f.type})}catch(e){}CM()};
window.DCT=async function(id){if(!confirm('¿Borrar?'))return;try{await col.cat.doc(id).delete()}catch(e){}};
window.exportData=function(){var d={exportDate:new Date().toISOString(),accounts:S.accs,categories:S.cats,transactions:S.txs,transfers:S.trs,debts:S.debts,goals:S.goals,budgets:S.bud};var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='finanzas-'+td()+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)};
window.exportCSV=function(){var rows=[['Fecha','Tipo','Monto','Descripcion','Categoria','Cuenta']];S.txs.forEach(function(t){var cat=gc(t.c),acc=ga(t.acc);rows.push([t.d,t.tp==='income'?'Ingreso':'Gasto',t.a,'"'+(t.ds||'').replace(/"/g,'""')+'"','"'+cat.name+'"','"'+acc.name+'"'])});var csv=rows.map(function(r){return r.join(',')}).join('\n');var b=new Blob(['\ufeff'+csv],{type:'text/csv'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='finanzas-'+td()+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)};
window.RA=async function(){if(!confirm('¿Borrar TODO?'))return;if(!confirm('¿Seguro?'))return;try{var cs=['transactions','transfers','accounts','categories','debts','goals','budgets'];for(var i=0;i<cs.length;i++){var sn=await db.collection(cs[i]).get();if(sn.docs.length){var ba=db.batch();sn.docs.forEach(function(d){ba.delete(d.ref)});await ba.commit()}}await col.meta.doc('status').set({migrated:false,version:''});alert('Borrado.')}catch(e){alert('Error: '+e.message)}};
window.doMigrate=doMigrate;
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
